# =============================================================================
# Kwik.gg - Upstream Definition
# Drop this into /etc/nginx/conf.d/kwik-upstream.conf
# =============================================================================

upstream kwik_app {
    server 127.0.0.1:3000 fail_timeout=30s max_fails=3;

    # Connection pooling for high-performance file transfers
    keepalive 128;              # Double connection pool for concurrent transfers
    keepalive_requests 10000;   # Reuse connections extensively
    keepalive_timeout 7200s;    # Keep connections alive during long transfers

    # Load balancing (if scaling to multiple instances)
    # least_conn;               # Route to least-busy backend
}
