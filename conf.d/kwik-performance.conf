# =============================================================================
# Kwik.gg - Performance & Timeout Settings
# Drop this into /etc/nginx/conf.d/kwikzip-performance.conf
# =============================================================================

# Optimized for large file transfers (50GB+)

# Timeouts for massive file transfers (2 hours)
client_body_timeout 7200;
send_timeout 7200;
proxy_connect_timeout 300;
proxy_send_timeout 7200;
proxy_read_timeout 7200;

# Keepalive for long transfers
keepalive_timeout 7200;
keepalive_requests 10000;

# Buffer Settings for large file transfers
client_body_buffer_size 1m;
client_max_body_size 0;
client_header_buffer_size 4k;
large_client_header_buffers 4 32k;
output_buffers 4 128k;

# Proxy buffer settings
proxy_buffer_size 128k;
proxy_buffers 8 256k;
proxy_busy_buffers_size 512k;

# TCP optimizations for large file transfers
tcp_nopush on;          # Send headers in one packet
tcp_nodelay on;         # Don't buffer data-sends (disable Nagle algorithm)
sendfile on;            # Use kernel sendfile() for zero-copy transfers
sendfile_max_chunk 2m;  # Limit per sendfile() call to prevent blocking

# AIO for better performance on large files
aio threads;            # Asynchronous I/O with thread pool
aio_write on;           # Async writes for downloads
directio 4m;            # Direct I/O for files > 4MB (bypass page cache)

# Connection optimization
reset_timedout_connection on;  # Reset timed-out connections to free memory
lingering_close on;            # Proper connection closure
lingering_time 30s;
lingering_timeout 5s;
