# =============================================================================
# Kwik.gg - Performance & Timeout Settings
# Drop this into /etc/nginx/conf.d/kwik-performance.conf
# =============================================================================

# Optimized for large file transfers (50GB+)

# Timeouts for massive file transfers (2 hours) - these go in http context
# client_body_timeout 7200; # Commented out - duplicate in main config
# send_timeout 7200; # Commented out - goes in http context
# proxy_connect_timeout 300; # Commented out - goes in http context
# proxy_send_timeout 7200; # Commented out - goes in http context
# proxy_read_timeout 7200; # Commented out - goes in http context

# Keepalive for long transfers - these go in http context
# keepalive_timeout 7200; # Commented out - goes in http context
# keepalive_requests 10000; # Commented out - goes in http context

# Buffer Settings for large file transfers - these go in http context
# client_body_buffer_size 1m; # Commented out - goes in http context
# client_max_body_size 0; # Commented out - goes in http context
# client_header_buffer_size 4k; # Commented out - goes in http context
# large_client_header_buffers 4 32k; # Commented out - goes in http context
# output_buffers 4 128k; # Commented out - goes in http context

# Proxy buffer settings
proxy_buffer_size 128k;
proxy_buffers 8 256k;
proxy_busy_buffers_size 512k;

# TCP optimizations for large file transfers
tcp_nopush on;          # Send headers in one packet
tcp_nodelay on;         # Don't buffer data-sends (disable Nagle algorithm)
sendfile on;            # Use kernel sendfile() for zero-copy transfers
sendfile_max_chunk 2m;  # Limit per sendfile() call to prevent blocking

# AIO for better performance on large files
aio threads;            # Asynchronous I/O with thread pool
aio_write on;           # Async writes for downloads
directio 4m;            # Direct I/O for files > 4MB (bypass page cache)

# Connection optimization
reset_timedout_connection on;  # Reset timed-out connections to free memory
lingering_close on;            # Proper connection closure
lingering_time 30s;
lingering_timeout 5s;
