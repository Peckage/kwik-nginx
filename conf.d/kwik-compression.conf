# =============================================================================
# Kwik.gg - Compression Settings
# Drop this into /etc/nginx/conf.d/kwik-compression.conf
# =============================================================================

# Gzip compression for bandwidth optimization
# NOTE: File payloads are already encrypted client-side, so compression is minimal
# This primarily benefits HTML, CSS, JS, and API responses

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;              # Balanced compression (1-9, higher = more CPU)
gzip_min_length 1024;           # Only compress files > 1KB
gzip_buffers 16 8k;
gzip_http_version 1.1;

# Compress these MIME types
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/rss+xml
    font/truetype
    font/opentype
    application/vnd.ms-fontobject
    image/svg+xml;

# Don't compress already-compressed formats
gzip_disable "msie6";

# Brotli compression (if module available - better than gzip)
# Uncomment if nginx compiled with brotli support
# brotli on;
# brotli_comp_level 6;
# brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
